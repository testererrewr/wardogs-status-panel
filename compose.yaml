services:
  server-status-hub:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PANEL_BIND:-0.0.0.0:3000}:3000"
    volumes:
      - ./data:/app/data
      - ./custom-bots:/app/custom-bots
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      - runner
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  status-node:
    build: .
    command: ["node", "src/status-node.js"]
    restart: unless-stopped
    depends_on:
      server-status-hub:
        condition: service_healthy
    environment:
      CONTROL_PLANE_URL: http://server-status-hub:3000
      STATUS_NODE_JOIN_SECRET: ${STATUS_NODE_JOIN_SECRET}
      STATUS_NODE_ID: ${LOCAL_STATUS_NODE_ID:-local-main}
      STATUS_NODE_NAME: ${LOCAL_STATUS_NODE_NAME:-Main VPS}
      STATUS_NODE_MAX_BOTS: ${LOCAL_STATUS_NODE_MAX_BOTS:-50}
      STATUS_NODE_SYNC_SECONDS: ${STATUS_NODE_SYNC_SECONDS:-10}
      STATUS_NODE_TOKEN_FILE: /node-data/token
    volumes:
      - status_node_data:/node-data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 192

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    # The panel writes custom-bot sources as uid/gid 1000 with owner-only files.
    # Run the runner with the same uid so cap_drop: ALL does not block access to
    # /workspace. Docker-socket access is granted only through its host group.
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET}
      RUNNER_PORT: 4000
      HOME: /tmp/runner-home
    expose:
      - "4000"
    volumes:
      - ./custom-bots:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 192
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header", "X-Runner-Secret: ${RUNNER_SHARED_SECRET}", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - server-status-hub
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  status_node_data:
  caddy_data:
  caddy_config:
